apiVersion: factory.gaddigital.io/v1alpha1
kind: Integration
metadata:
  id: gitlab
  name: Gitlab
  version: 0.1.0
provider: gitlab
capabilities:
- id: source-control
  operations:
  - inspect-status
  - create-branch
  - commit
  - push
  - get-diff
  - submit-change
  - get-change
  - comment-change
  - merge
  mcpToolHints:
  - gitlab.*
- id: task-provider
  operations:
  - get-task
  - search-task
  - create-task
  - comment-task
  - link-task
  - link-change
  mcpToolHints:
  - gitlab.*
  operationMappings:
    get-task: get_issue
    search-task: search
    create-task: create_issue
    comment-task: create_workitem_note
    link-task: link_work_items
    link-change: link_work_items
- id: continuous-integration
  operations:
  - get-pipeline
  - get-validation-result
  mcpToolHints:
  - gitlab.*
policyRefs:
- external-action-policy
