apiVersion: factory.gaddigital.io/v1alpha1
kind: McpBinding
metadata: {id: gitlab-default, name: GitLab MCP, version: 1.0.0}
provider: gitlab
capabilities: [source-control, task-provider, continuous-integration]
transport:
  type: http
  urlEnvironment: GITLAB_MCP_URL
  environment: [GITLAB_MCP_URL]
authentication:
  type: oauth
adapterOverrides:
  codex:
    transport:
      type: stdio
      command: npx
      args:
        - -y
        - mcp-remote@0.1.26
        - https://gitlab.com/api/v4/mcp
        - --static-oauth-client-metadata
        - '{"scope":"mcp"}'
    authentication:
      type: oauth
toolHints: [gitlab.*]
