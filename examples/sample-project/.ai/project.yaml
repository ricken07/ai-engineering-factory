apiVersion: aief.dev/v1alpha1
kind: Project
metadata:
  id: sample-project
  name: Sample Project
factory:
  version: 1.1.0
  homeEnv: AI_FACTORY_HOME
workspace:
  strategy: polyrepo
  root: .
workspaceSafety:
  mode: worktree
  baseBranch: main
  taskBranchPrefix: aief
activation:
  mode: auto
repositories:
  - id: backend
    path: ./backend
    role: backend-api
    profiles: [java, spring, maven]
    responsibilities: [business-api, persistence, external-integrations]
    dependencies: []
    criticalDomains: [authentication, personal-data]
    git:
      baseBranch: main
    engineering:
      practices:
        hexagonal-architecture: {mode: enable}
        module-conventions:
          mode: enable
          category: convention
          ref: .ai/context/module-conventions.md
  - id: frontend
    path: ./frontend
    role: application
    profiles: [react]
    responsibilities: [user-interface]
    dependencies:
      - {repository: backend, type: REST}
    criticalDomains: [personal-data]
    git:
      baseBranch: main
context:
  project: .ai/context/project.md
  architecture: .ai/context/architecture.md
  domain: .ai/context/domain.md
  conventions: .ai/context/conventions.md
  decisions: .ai/decisions
  memory: .ai/memory/shared.md
  memoryPatterns: .ai/memory/patterns.md
  knownConstraints: .ai/memory/known-constraints.md
  lessons: .ai/memory/lessons.md
runtime:
  root: .ai/runtime
  taskRetentionDays: 30
  executionRetentionDays: 14
  durableTaskSystem: gitlab
integrations:
  source-control:
    provider: gitlab
  task-provider:
    provider: gitlab
  knowledge-base:
    provider: confluence
integrationLock: .ai/integration-lock.yaml
taskTracking:
  mode: external
autonomy:
  default: L2
  maximum: L3
policyRefs: []
engineering:
  inheritOrganization: true
  organizationCatalogs: [factory-default@1.0.0]
  practices:
    api-design: {mode: enable}
