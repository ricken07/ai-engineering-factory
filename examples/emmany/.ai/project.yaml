apiVersion: factory.gaddigital.io/v1alpha1
kind: Project
metadata:
  id: emmany
  name: Emmany Gateway
factory:
  version: 1.11.0
  homeEnv: GAD_AI_FACTORY_HOME
workspace:
  strategy: polyrepo
  root: .
workspaceSafety:
  mode: worktree
  baseBranch: main
  taskBranchPrefix: aief
repositories:
  - id: egw-api
    path: ./egw-api
    role: backend-api
    profiles: [java, spring, maven]
    responsibilities: [payment-orchestration, transactions, webhooks, provider-integrations]
    dependencies: []
    criticalDomains: [payment, payout, authentication, transaction]
    git:
      baseBranch: main
    engineering:
      practices:
        hexagonal-architecture: {mode: enable}
        payment-module-conventions:
          mode: enable
          category: convention
          ref: .ai/context/payment-module-conventions.md
  - id: egw-app
    path: ./egw-app
    role: application
    profiles: [flutter]
    responsibilities: [merchant-experience, transaction-visualization]
    dependencies:
      - {repository: egw-api, type: REST}
    criticalDomains: [transaction]
    git:
      baseBranch: main
context:
  project: .ai/context/project.md
  architecture: .ai/context/architecture.md
  domain: .ai/context/domain.md
  conventions: .ai/context/conventions.md
  decisions: .ai/decisions
  memory: .ai/memory/shared.md
  memoryPatterns: .ai/memory/patterns.md
  knownConstraints: .ai/memory/known-constraints.md
  lessons: .ai/memory/lessons.md
runtime:
  root: .ai/runtime
  taskRetentionDays: 30
  executionRetentionDays: 14
  durableTaskSystem: gitlab
integrations:
  source-control:
    provider: gitlab
  task-provider:
    provider: gitlab
  knowledge-base:
    provider: confluence
integrationLock: .ai/integration-lock.yaml
autonomy:
  default: L2
  maximum: L3
policyRefs: []
engineering:
  inheritOrganization: true
  practices:
    api-design: {mode: enable}
