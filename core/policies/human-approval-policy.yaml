apiVersion: aief.dev/v1alpha1
kind: Policy
metadata: {id: human-approval-policy, name: Human Approval Policy, version: 0.1.0}
scope: factory
priority: 100
rules:
  - id: critical-gates
    when: {risk: critical}
    # Every human approval of a critical execution is typed at a terminal
    # (aief.approval): a decision relayed by an agent is not enough.
    effect: {requireApproval: [before-implementation, before-commit, before-submission, before-merge], approvalAssurance: OBSERVED}
  - id: high-gates
    when: {risk: high}
    effect: {requireApproval: [before-commit, before-submission, before-merge]}
  - id: medium-gates
    when: {risk: medium}
    effect: {requireApproval: [before-merge]}
  - id: protected-branch
    when: {targetBranch: {protected: true}}
    effect: {requireApproval: [before-merge]}
