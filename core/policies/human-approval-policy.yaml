apiVersion: factory.gaddigital.io/v1alpha1
kind: Policy
metadata: {id: human-approval-policy, name: Human Approval Policy, version: 0.1.0}
scope: factory
priority: 100
rules:
  - id: critical-gates
    when: {risk: critical}
    effect: {requireApproval: [before-implementation, before-commit, before-submission, before-merge]}
  - id: high-gates
    when: {risk: high}
    effect: {requireApproval: [before-commit, before-submission, before-merge]}
  - id: medium-gates
    when: {risk: medium}
    effect: {requireApproval: [before-merge]}
  - id: protected-branch
    when: {targetBranch: {protected: true}}
    effect: {requireApproval: [before-merge]}
