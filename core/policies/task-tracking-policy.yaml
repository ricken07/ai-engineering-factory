apiVersion: factory.gaddigital.io/v1alpha1
kind: Policy
metadata: {id: task-tracking-policy, name: Task Tracking Policy, version: 0.1.0}
scope: factory
priority: 100
rules:
  - id: externally-track-high-risk
    when: {riskAtLeast: high}
    effect: {tracking: required, requiredBefore: [implementation]}
  - id: externally-track-cross-repository
    when: {impactedRepositoriesGreaterThan: 1}
    effect: {tracking: required, requiredBefore: [implementation]}
  - id: recommend-functional-tracking
    when: {changeTypesContain: [functional-change, source-code, configuration, dependency]}
    effect: {tracking: recommended}
  - id: optional-informational-work
    when: {taskNatureIn: [informational, validation, review]}
    effect: {tracking: optional}
  - id: optional-documentation-only
    when: {changeTypesContainOnly: [documentation]}
    effect: {tracking: optional}
  - id: optional-small-refactoring
    when: {changeTypesContainOnly: [refactoring], riskAtMost: low}
    effect: {tracking: optional}
  - id: recommend-meaningful-change
    when: {taskNatureIn: [change], changeTypesNotContainOnly: [refactoring, documentation]}
    effect: {tracking: recommended}
