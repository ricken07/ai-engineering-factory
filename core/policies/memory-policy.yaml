apiVersion: aief.dev/v1alpha1
kind: Policy
metadata: {id: memory-policy, name: Memory Policy, version: 1.0.0}
scope: factory
priority: 100
rules:
  - id: session-memory
    when: {memoryTier: session}
    effect: {persistence: ephemeral, approvalRequired: false}
  - id: task-memory
    when: {memoryTier: task}
    effect: {persistence: task-lifetime, approvalRequired: false}
  - id: project-memory
    when: {memoryTier: project}
    effect: {persistence: durable, approvalRequired: true}
  - id: promotion-separation
    when: {action: promote-knowledge}
    effect: {requireApproval: [before-project-knowledge-write], separationOfDuties: [propose, approve, record]}
  - id: task-runtime-default
    when: {memoryTier: task}
    effect: {defaultStorage: project-runtime, gitignored: true, publishSummaryToDurableTaskSystem: true}
  - id: authority-conflict
    when: {knowledgeConflict: true}
    effect: {forbid: [silent-resolution], requireAction: [record-conflict, request-authoritative-resolution]}
  - id: decision-record
    when: {memoryTier: decision}
    effect: {persistence: durable, storage: decision-record, approvalRequired: true}
  - id: no-secrets
    effect: {forbidPersistence: [credentials, tokens, private-keys, secrets]}
