apiVersion: aief.dev/v1alpha1
kind: Skill
metadata:
  id: summarize-change
  name: Summarize Change
  version: 0.1.0
mode: read-only
contract:
  inputs:
  - changes
  - validation-report
  - review-report
  outputs:
  - change-summary
  requiresCapabilities: []
standardRefs:
- recovery
- traceability
policyRefs:
- recovery-policy
- context-policy
- change-policy
- traceability-policy
rules:
- Summarize behavior and scope, not only filenames.
