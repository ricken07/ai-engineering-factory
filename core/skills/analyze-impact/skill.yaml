apiVersion: aief.dev/v1alpha1
kind: Skill
metadata:
  id: analyze-impact
  name: Analyze Impact
  version: 0.1.0
mode: read-only
contract:
  inputs:
  - task
  - project
  - resolved-context
  outputs:
  - impact-analysis
  - impacted-repositories
  - impacted-components
  requiresCapabilities: []
standardRefs:
- recovery
- impact-analysis
policyRefs:
- recovery-policy
- context-policy
- change-policy
- traceability-policy
rules:
- Identify direct and transitive impact.
- Do not modify source code.
engineeringContext:
  requires: [architecture, security]
