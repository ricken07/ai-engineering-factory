apiVersion: factory.gaddigital.io/v1alpha1
kind: Skill
metadata:
  id: validate-change
  name: Validate Change
  version: 0.1.0
mode: validation
contract:
  inputs:
  - changes
  - project
  - profiles
  outputs:
  - validation-report
  requiresCapabilities: []
standardRefs:
- recovery
- validation
policyRefs:
- recovery-policy
- context-policy
- change-policy
- traceability-policy
rules:
- Use project/profile-defined validations.
- Use continuous-integration only when the project binds it and remote validation is relevant.
- Report failures without masking them.
engineeringContext:
  requires: [testing, security]
