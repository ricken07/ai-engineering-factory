apiVersion: factory.gaddigital.io/v1alpha1
kind: Standard
metadata:
  id: handoff
  name: Handoff
  version: 0.1.0
appliesTo:
- handoff
requirements:
- id: HO-01
  statement: A handoff must be usable without the previous agent session.
  evidence:
  - handoff
- id: HO-02
  statement: Include objective, current status, decisions, constraints, artifacts,
    open questions and next actions.
  evidence:
  - handoff
outputs:
- handoff
