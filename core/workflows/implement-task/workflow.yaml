apiVersion: factory.gaddigital.io/v1alpha1
kind: Workflow
metadata:
  id: implement-task
  name: Implement Task
  version: 0.1.0
inputs:
- task
- project
phases:
- id: understand
  skill: understand-task
- id: resolve-context
  skill: resolve-context
- id: analyze-impact
  skill: analyze-impact
- id: assess-risk
  skill: assess-risk
- id: planning
  skill: create-plan
  gate:
    id: plan-gate
    type: policy
    policy: human-approval-policy
    description: Policy may require approval before implementation.
- id: implementation
  skill: implement-change
- id: validation
  skill: validate-change
- id: review
  skill: review-change
- id: summary
  skill: summarize-change
- id: traceability
  skill: record-traceability
- id: submission
  skill: submit-change
  gate:
    id: submission-gate
    type: policy
    policy: human-approval-policy
    description: Policy may require approval before submission.
outputs:
- implementation-plan
- changes
- validation-report
- review-report
- change-summary
- traceability
- change-request
policyRefs:
- risk-policy
- autonomy-policy
- human-approval-policy
- change-policy
- context-policy
- traceability-policy
