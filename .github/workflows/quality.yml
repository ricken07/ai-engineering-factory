name: quality
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          python-version: "3.12"
      # The lock must match pyproject.toml; the install is exactly the committed lock.
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest
      - run: uv run --locked python tools/validate_package.py
