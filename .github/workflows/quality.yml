name: quality
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.28"
          python-version: "3.12"
      # Installs exactly the committed uv.lock; fails if the lock is out of date.
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen pytest
      - run: uv run --frozen python tools/validate_package.py
