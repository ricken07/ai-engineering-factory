[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-factory"
version = "1.4.0"
description = "Deterministic governance runtime for AI-assisted software engineering"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aief = "aief.cli:main"

[tool.setuptools.packages.find]
include = ["aief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
