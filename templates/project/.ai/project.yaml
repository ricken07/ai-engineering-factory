apiVersion: aief.dev/v1alpha1
kind: Project
metadata:
  id: replace-me
  name: Replace Me
factory:
  version: 1.0.0
  homeEnv: AI_FACTORY_HOME
workspace:
  strategy: monorepo
  root: .
workspaceSafety:
  mode: require-clean
  baseBranch: main
  taskBranchPrefix: aief
activation:
  # auto: a native command (/implement, $implement, ...) always runs directly;
  #   free text asks the developer for explicit confirmation before routing
  #   through the Factory, and is handled directly by the agent otherwise.
  # manual: the Factory is off by default; a native command still activates it,
  #   but only for that single execution; free text never routes through the
  #   Factory.
  mode: auto
repositories:
  - id: main
    path: .
    role: application
    profiles: [generic]
    responsibilities: []
    dependencies: []
    criticalDomains: []
    git:
      baseBranch: main
context:
  project: .ai/context/project.md
  architecture: .ai/context/architecture.md
  domain: .ai/context/domain.md
  conventions: .ai/context/conventions.md
  decisions: .ai/decisions
  memory: .ai/memory/shared.md
  memoryPatterns: .ai/memory/patterns.md
  knownConstraints: .ai/memory/known-constraints.md
  lessons: .ai/memory/lessons.md
runtime:
  root: .ai/runtime
  taskRetentionDays: 30
  executionRetentionDays: 14
integrations: {}
integrationLock: .ai/integration-lock.yaml
taskTracking:
  # local: .ai/runtime is the traceability system; no task-provider is required.
  # external: required tracking must be linked through the configured task-provider.
  mode: local
autonomy:
  default: L1
  maximum: L2
policyRefs: []
engineering:
  inheritOrganization: true
  organizationCatalogs: [factory-default@1.0.0]
  practices: {}
